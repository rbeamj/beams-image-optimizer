<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><title>bg-eval runner</title></head>
  <body>
    <p id="status">Runner ready. Call window.runAll(configs).</p>
    <script type="module">
      window.runOne = (config, timeoutMs = 600000) => new Promise(resolve => {
        const frame = document.createElement('iframe');
        const timer = setTimeout(() => { frame.remove(); resolve({ ...config, ok: false, error: `timeout after ${timeoutMs} ms` }); }, timeoutMs);
        const onMessage = event => {
          if (event.source !== frame.contentWindow || !event.data?.benchResult) return;
          clearTimeout(timer);
          window.removeEventListener('message', onMessage);
          frame.remove();
          resolve(event.data.benchResult);
        };
        window.addEventListener('message', onMessage);
        frame.src = `./browser.html?cfg=${encodeURIComponent(JSON.stringify(config))}`;
        document.body.append(frame);
      });
      window.results = [];
      window.runAll = async configs => {
        for (const config of configs) {
          document.querySelector('#status').textContent = `running ${config.file} ${config.provider}`;
          const r = await window.runOne(config);
          window.results.push(r);
          await new Promise(res => setTimeout(res, 1500));
        }
        document.querySelector('#status').textContent = 'done';
        return window.results;
      };
    </script>
  </body>
</html>
